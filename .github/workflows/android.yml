name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - arabic_money.py
      - test_arabic_money.py
      - test_app_smoke.py
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Arabic money formatting
        run: python -m unittest -v test_arabic_money.py
      - name: Install Briefcase
        run: python -m pip install briefcase==0.3.26
      - name: Test application startup and Arabic result
        run: |
          python -m pip install toga-dummy==0.5.3 httpx==0.28.1 pytest pillow
          python test_app_smoke.py
      - name: Prepare Android project from app.py
        run: |
          mkdir -p src/currencyconverter
          cp app.py arabic_money.py src/currencyconverter/
          touch src/currencyconverter/__init__.py
          printf '%s\n' 'from currencyconverter.app import main' 'main().main_loop()' > src/currencyconverter/__main__.py
          cat > pyproject.toml <<'TOML'
          [tool.briefcase]
          project_name = "Currency Converter"
          bundle = "com.almosheqh"
          version = "1.0.0"
          url = "https://github.com/almosheqh100-glitch/Currency-Converter"
          license = "Proprietary"
          author = "almosheqh100-glitch"

          [tool.briefcase.app.currencyconverter]
          formal_name = "Currency Converter"
          description = "Arabic currency converter"
          sources = ["src/currencyconverter"]
          requires = ["httpx==0.28.1"]

          [tool.briefcase.app.currencyconverter.android]
          requires = ["toga-android==0.5.3"]
          build_gradle_dependencies = [
              "com.google.android.material:material:1.12.0",
              "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
          ]
          TOML
          python -m compileall -q src
      - name: Create Android project
        run: briefcase create android --no-input
      - name: Build Android app
        run: briefcase build android --no-input
      - name: Package release APK
        run: briefcase package android -p apk --no-input
      - name: Sign release with the permanent app key
        id: signing
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "Signing key is not configured. Release compilation passed; no installable release will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ["SIGNING_BUNDLE"])
          tmp = Path(os.environ["RUNNER_TEMP"])
          (tmp / "release.pk8").write_bytes(base64.b64decode(bundle["private_key_pk8"]))
          (tmp / "release.pem").write_text(bundle["certificate_pem"])
          PY
          trap 'rm -f "$RUNNER_TEMP/release.pk8" "$RUNNER_TEMP/release.pem"' EXIT
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          BUILD_TOOLS=$(dirname "$BUILD_TOOLS")
          APK=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p release
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --key "$RUNNER_TEMP/release.pk8" --cert "$RUNNER_TEMP/release.pem" --out release/Currency-Converter-1.0.0.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release/Currency-Converter-1.0.0.apk
          sha256sum release/Currency-Converter-1.0.0.apk > release/SHA256SUMS.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Currency-Converter-1.0.0-Release
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: logs/
          if-no-files-found: ignore
